<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Monitor (Auto Network Routing)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; text-align: center; }
        .container { max-width: 1050px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 18px; border-radius: 10px; border: 1px solid #334155; }
        .refresh-btn { background: #0284c7; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .refresh-btn:hover { background: #0369a1; }
        .selector-card { background: #1e293b; border: 1px solid #334155; padding: 14px; border-radius: 12px; }
        .cam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 8px; margin-top: 10px; }
        .cam-btn { background: #0f172a; color: #cbd5e1; border: 1px solid #334155; padding: 10px 8px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; white-space: nowrap; }
        .cam-btn:hover { background: #334155; color: #fff; }
        .cam-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .video-wrapper { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
        .video-header { padding: 10px 16px; background: #111827; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; }
        .badge { background: #16a34a; color: #fff; font-size: 11px; padding: 4px 10px; border-radius: 9999px; }
        .expand-btn { background: #334155; color: #fff; border: 1px solid #475569; padding: 4px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; margin-left: 8px; }
        iframe { width: 100%; height: 520px; border: none; background: #000; display: block; }
        .playback-card { background: #1e293b; border: 1px solid #334155; padding: 14px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
        .time-input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
        .play-btn { background: #16a34a; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .ptz-card { background: #1e293b; border: 1px solid #334155; padding: 14px; border-radius: 12px; display: inline-block; margin: 0 auto; }
        .controls-grid { display: grid; grid-template-columns: repeat(3, 75px); grid-gap: 8px; justify-content: center; margin: 10px 0; }
        .ptz-btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .ptz-btn:hover { background: #7dd3fc; }
        .zoom-group { display: flex; justify-content: center; gap: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h2>Хяналтын Систем (<span id="netStatus" style="color:#38bdf8;">Сүлжээ шалгаж байна...</span>)</h2>
            <button class="refresh-btn" onclick="fetchConnectedCameras()">🔄 Камеруудыг дахин скан хийх</button>
        </div>

        <div class="selector-card">
            <div style="text-align: left; font-size: 13px; color: #94a3b8; font-weight: bold;">
                Холбогдсон камерууд (<span id="camCount">0</span>):
            </div>
            <div class="cam-grid" id="camGrid">
                <div style="color: #64748b; font-size: 13px;">Камеруудыг хайж байна...</div>
            </div>
        </div>

        <div class="video-wrapper" id="playerWrapper">
            <div class="video-header">
                <span id="currentCamTitle">Камер сонгогдоогүй</span>
                <div>
                    <span class="badge" id="statusBadge">ХҮЛЭЭГДЭЖ БАЙНА</span>
                    <button class="expand-btn" onclick="toggleFullScreen('playerWrapper')">⛶ Бүтэн дэлгэц</button>
                </div>
            </div>
            <iframe id="livePlayer" src="" allow="fullscreen; autoplay"></iframe>
        </div>

        <div class="playback-card">
            <span style="font-size: 13px; font-weight: bold; color: #94a3b8;">Бичлэг ухраах:</span>
            <input type="datetime-local" id="playbackTime" class="time-input">
            <button class="play-btn" onclick="playRecord()">▶ Бичлэг эхлүүлэх</button>
            <button class="refresh-btn" style="background:#475569;" onclick="returnToLive()">Шууд дүрс рүү буцах</button>
        </div>

        <div class="ptz-card">
            <span style="font-size: 13px; color: #94a3b8;">PTZ Удирдлага</span>
            <div class="controls-grid">
                <div></div>
                <button class="ptz-btn" onclick="sendPTZ('up')">▲ Дээш</button>
                <div></div>
                <button class="ptz-btn" onclick="sendPTZ('left')">◀ Зүүн</button>
                <div style="display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:12px;">PTZ</div>
                <button class="ptz-btn" onclick="sendPTZ('right')">Баруун ▶</button>
                <div></div>
                <button class="ptz-btn" onclick="sendPTZ('down')">▼ Доош</button>
                <div></div>
            </div>
            <div class="zoom-group">
                <button class="ptz-btn" onclick="sendPTZ('zoomin')">🔍 Zoom (+)</button>
                <button class="ptz-btn" onclick="sendPTZ('zoomout')">🔎 Zoom (-)</button>
            </div>
        </div>
    </div>

    <script>
        const WAN_IP = "202.131.225.19";
        const LAN_IP = "192.168.88.21";
        
        let ACTIVE_IP = WAN_IP;
        let API_HOST = `http://${ACTIVE_IP}:8891`;
        let STREAM_URL = `http://${ACTIVE_IP}:8890/live`;

        let activeDev = "";
        let activeCh = 1;
        let activeTitle = "";

        // Сүлжээг шалгаж LAN эсвэл WAN-г автоматаар сонгох функц
        async function detectWorkingHost() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1200);

            try {
                // Эхлээд LAN IP-рүү туршиж үзнэ
                await fetch(`http://${LAN_IP}:8891/cameras`, { signal: controller.signal });
                clearTimeout(timeoutId);
                ACTIVE_IP = LAN_IP;
                document.getElementById('netStatus').innerText = `Дотоод LAN (${LAN_IP})`;
            } catch (e) {
                // Амжилтгүй бол WAN IP-г ашиглана
                ACTIVE_IP = WAN_IP;
                document.getElementById('netStatus').innerText = `Гадаад WAN (${WAN_IP})`;
            }

            API_HOST = `http://${ACTIVE_IP}:8891`;
            STREAM_URL = `http://${ACTIVE_IP}:8890/live`;
            fetchConnectedCameras();
        }

        function fetchConnectedCameras() {
            const grid = document.getElementById('camGrid');
            grid.innerHTML = "<div style='color: #64748b;'>Хайж байна...</div>";

            fetch(`${API_HOST}/cameras`)
                .then(r => r.json())
                .then(cameras => {
                    grid.innerHTML = "";
                    document.getElementById('camCount').innerText = cameras.length;

                    if (cameras.length === 0) {
                        grid.innerHTML = "<div style='color: #ef4444;'>Серверт төхөөрөмж холбогдоогүй байна.</div>";
                        return;
                    }

                    cameras.forEach((cam, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'cam-btn';
                        btn.innerText = `${cam.name} (CH ${cam.channel})`;
                        btn.onclick = () => selectCamera(cam.devId, cam.channel, `${cam.name} CH ${cam.channel}`, btn);
                        grid.appendChild(btn);

                        if (index === 0 && !activeDev) {
                            selectCamera(cam.devId, cam.channel, `${cam.name} CH ${cam.channel}`, btn);
                        }
                    });
                })
                .catch(err => {
                    grid.innerHTML = "<div style='color: #ef4444;'>Сервертэй холбогдож чадсангүй.</div>";
                });
        }

        function selectCamera(dev, ch, title, btn) {
            activeDev = dev;
            activeCh = ch;
            activeTitle = title;

            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            document.getElementById('currentCamTitle').innerText = title + " (ШУУД)";
            document.getElementById('statusBadge').innerText = "ХОЛБОЖ БАЙНА...";
            document.getElementById('statusBadge').style.background = "#d97706";

            fetch(`${API_HOST}/switch?dev=${dev}&ch=${ch}`)
                .then(r => r.json())
                .then(() => {
                    setTimeout(() => {
                        document.getElementById('livePlayer').src = `${STREAM_URL}?t=${Date.now()}`;
                        document.getElementById('statusBadge').innerText = "ШУУД ДҮРС";
                        document.getElementById('statusBadge').style.background = "#16a34a";
                    }, 2500);
                })
                .catch(e => {
                    document.getElementById('statusBadge').innerText = "АЛДАА";
                    document.getElementById('statusBadge').style.background = "#dc2626";
                });
        }

        function playRecord() {
            const timeInput = document.getElementById('playbackTime');
            if (!timeInput.value || !activeDev) return;

            const raw = timeInput.value.replace(/[-:]/g, '');
            const startStr = raw + "00";

            const d = new Date(timeInput.value);
            d.setMinutes(d.getMinutes() + 30);
            const pad = (n) => n.toString().padStart(2, '0');
            const endStr = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

            document.getElementById('statusBadge').innerText = "БИЧЛЭГ ХАЙЖ БАЙНА...";
            document.getElementById('statusBadge').style.background = "#8b5cf6";

            fetch(`${API_HOST}/playback?dev=${activeDev}&ch=${activeCh}&start=${startStr}&end=${endStr}`)
                .then(r => r.json())
                .then(() => {
                    setTimeout(() => {
                        document.getElementById('livePlayer').src = `${STREAM_URL}?t=${Date.now()}`;
                        document.getElementById('currentCamTitle').innerText = `${activeTitle} (БИЧЛЭГ)`;
                        document.getElementById('statusBadge').innerText = "БИЧЛЭГ ТОГЛОЖ БАЙНА";
                        document.getElementById('statusBadge').style.background = "#6366f1";
                    }, 3000);
                });
        }

        function returnToLive() {
            if (activeDev) selectCamera(activeDev, activeCh, activeTitle, null);
        }

        function sendPTZ(cmd) {
            if (!activeDev) return;
            fetch(`${API_HOST}/ptz?dev=${activeDev}&ch=${activeCh}&cmd=${cmd}`);
        }

        function toggleFullScreen(elemId) {
            const elem = document.getElementById(elemId);
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        window.onload = () => {
            detectWorkingHost();
            const now = new Date();
            now.setMinutes(now.getMinutes() - 15);
            const pad = (n) => n.toString().padStart(2, '0');
            document.getElementById('playbackTime').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
        };
    </script>
</body>
</html>
