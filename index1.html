<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Camera Monitor</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .title {
            padding: 10px;
            font-size: 14px;
            background: #111827;
            text-align: left;
        }
        iframe {
            width: 100%;
            height: 260px;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <h2>Хяналтын Камерууд (Шууд)</h2>

    <div class="grid">
        <!-- Дан камер -->
        <div class="card">
            <div class="title">Камер 1 (FG1183082)</div>
            <!-- HTTPS домэйн эсвэл IP хаягаа бичнэ -->
            <iframe src="https://таны-домэйн:8889/FG1183082_cam1"></iframe>
        </div>

        <!-- NVR суваг 1 -->
        <div class="card">
            <div class="title">NVR - Камер 1 (GB5857342)</div>
            <iframe src="https://таны-домэйн:8889/GB5857342_cam1"></iframe>
        </div>

        <!-- NVR суваг 2 -->
        <div class="card">
            <div class="title">NVR - Камер 2 (GB5857342)</div>
            <iframe src="https://таны-домэйн:8889/GB5857342_cam2"></iframe>
        </div>

        <!-- NVR суваг 3 -->
        <div class="card">
            <div class="title">NVR - Камер 3 (GB5857342)</div>
            <iframe src="https://таны-домэйн:8889/GB5857342_cam3"></iframe>
        </div>
    </div>

</body>
</html>
