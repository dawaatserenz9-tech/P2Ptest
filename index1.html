<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera & NVR Live Monitor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: sans-serif; 
            padding: 20px; 
            text-align: center; 
        }
        .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* PTZ Удирдлага */
        .ptz-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            margin: 0 auto;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-gap: 8px;
            justify-content: center;
            margin: 12px 0;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #7dd3fc; }
        button:active { background: #0284c7; }
        .zoom-group { display: flex; justify-content: center; gap: 10px; }
        select { 
            padding: 8px 12px; 
            border-radius: 6px; 
            background: #0b0f19; 
            color: #fff; 
            border: 1px solid #475569; 
        }

        /* Камеруудын дэлгэц */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); 
            gap: 15px; 
        }
        .video-box { 
            background: #1e293b; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid #334155; 
        }
        .video-header {
            padding: 10px 14px;
            background: #111827;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .badge {
            background: #16a34a;
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
        }
        iframe { 
            width: 100%; 
            height: 280px; 
            border: none; 
            background: #000; 
            display: block; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Хяналтын Камерууд (Шууд Дүрс & PTZ)</h2>

        <!-- PTZ удирдлагын хэсэг -->
        <div class="ptz-card">
            <div>
                <label>Удирдах камер: </label>
                <select id="targetCam">
                    <option value="FG1183082:1">Дан Камер (FG1183082)</option>
                    <option value="GB5857342:1">NVR - Камер 1</option>
                    <option value="GB5857342:2">NVR - Камер 2</option>
                    <option value="GB5857342:3">NVR - Камер 3</option>
                    <option value="GB5857342:4">NVR - Камер 4</option>
                </select>
            </div>

            <div class="controls-grid">
                <div></div>
                <button onclick="sendPTZ('up')">▲ Дээш</button>
                <div></div>
                <button onclick="sendPTZ('left')">◀ Зүүн</button>
                <div style="display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:12px;">PTZ</div>
                <button onclick="sendPTZ('right')">Баруун ▶</button>
                <div></div>
                <button onclick="sendPTZ('down')">▼ Доош</button>
                <div></div>
            </div>

            <div class="zoom-group">
                <button onclick="sendPTZ('zoomin')">🔍 Zoom In (+)</button>
                <button onclick="sendPTZ('zoomout')">🔎 Zoom Out (-)</button>
            </div>
        </div>

        <!-- Дүрс харуулах хэсэг -->
        <div class="grid">
            <!-- 1. Дан камер -->
            <div class="video-box">
                <div class="video-header">
                    <span>Дан Камер (FG1183082)</span>
                    <span class="badge">LIVE</span>
                </div>
                <iframe src="http://202.131.225.19:8889/FG1183082_cam1"></iframe>
            </div>

            <!-- 2. NVR Камер 1 -->
            <div class="video-box">
                <div class="video-header">
                    <span>NVR - Камер 1 (GB5857342)</span>
                    <span class="badge">LIVE</span>
                </div>
                <iframe src="http://202.131.225.19:8889/GB5857342_cam1"></iframe>
            </div>

            <!-- 3. NVR Камер 2 -->
            <div class="video-box">
                <div class="video-header">
                    <span>NVR - Камер 2 (GB5857342)</span>
                    <span class="badge">LIVE</span>
                </div>
                <iframe src="http://202.131.225.19:8889/GB5857342_cam2"></iframe>
            </div>

            <!-- 4. NVR Камер 3 -->
            <div class="video-box">
                <div class="video-header">
                    <span>NVR - Камер 3 (GB5857342)</span>
                    <span class="badge">LIVE</span>
                </div>
                <iframe src="http://202.131.225.19:8889/GB5857342_cam3"></iframe>
            </div>
        </div>
    </div>

    <script>
        const API_HOST = "http://202.131.225.19:8080";

        function sendPTZ(cmd) {
            const selectVal = document.getElementById("targetCam").value;
            const [dev, ch] = selectVal.split(":");

            fetch(`${API_HOST}/ptz?dev=${dev}&ch=${ch}&cmd=${cmd}`)
                .then(r => r.json())
                .catch(e => console.error("PTZ Алдаа:", e));
        }
    </script>
</body>
</html>
