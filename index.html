<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic CCTV Monitor & Playback</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0b0f19; 
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 16px; 
            text-align: center; 
        }
        .container { 
            max-width: 1050px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .refresh-btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .refresh-btn:hover { background: #0369a1; }

        /* Динамик Камер Жагсаалт */
        .selector-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 12px;
        }
        .cam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }
        .cam-btn {
            background: #0f172a;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 10px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.15s;
        }
        .cam-btn:hover { background: #334155; color: #fff; }
        .cam-btn.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* Видео дэлгэц */
        .video-wrapper {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .video-header {
            padding: 10px 16px;
            background: #111827;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }
        .badge {
            background: #16a34a;
            color: #fff;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 9999px;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
            background: #000;
            display: block;
        }

        /* Бичлэг үзэх хэсэг */
        .playback-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }
        .time-input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        .play-btn {
            background: #16a34a;
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .play-btn:hover { background: #15803d; }

        /* PTZ Удирдлага */
        .ptz-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 12px;
            display: inline-block;
            margin: 0 auto;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-gap: 8px;
            justify-content: center;
            margin: 10px 0;
        }
        .ptz-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .zoom-group { display: flex; justify-content: center; gap: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h2>Хяналтын Систем (Динамик Сүлжээ)</h2>
            <button class="refresh-btn" onclick="fetchConnectedCameras()">🔄 Камеруудыг дахин скан хийх</button>
        </div>

        <!-- Динамик Камер сонгох хэсэг -->
        <div class="selector-card">
            <div style="text-align: left; font-size: 13px; color: #94a3b8; font-weight: bold;">
                Одоогоор холбогдсон камерууд (<span id="camCount">0</span>):
            </div>
            <div class="cam-grid" id="camGrid">
                <div style="color: #64748b; font-size: 13px;">Камеруудыг хайж байна...</div>
            </div>
        </div>

        <!-- Видео дэлгэц -->
        <div class="video-wrapper">
            <div class="video-header">
                <span id="currentCamTitle">Камер сонгогдоогүй</span>
                <span class="badge" id="statusBadge">ХҮЛЭЭГДЭЖ БАЙНА</span>
            </div>
            <iframe id="livePlayer" src="" allow="fullscreen; autoplay"></iframe>
        </div>

        <!-- Бичлэг ухрааж үзэх (Playback) хэсэг -->
        <div class="playback-card">
            <span style="font-size: 13px; font-weight: bold; color: #94a3b8;">Бичлэг ухраах:</span>
            <input type="datetime-local" id="playbackTime" class="time-input">
            <button class="play-btn" onclick="playRecord()">▶ Бичлэг эхлүүлэх</button>
            <button class="refresh-btn" style="background:#475569;" onclick="returnToLive()">Шууд дүрс рүү буцах</button>
        </div>

        <!-- Идэвхтэй камерын PTZ удирдлага -->
        <div class="ptz-card">
            <span style="font-size: 13px; color: #94a3b8;">PTZ Удирдлага</span>
            <div class="controls-grid">
                <div></div>
                <button class="ptz-btn" onclick="sendPTZ('up')">▲ Дээш</button>
                <div></div>
                <button class="ptz-btn" onclick="sendPTZ('left')">◀ Зүүн</button>
                <div style="display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:12px;">PTZ</div>
                <button class="ptz-btn" onclick="sendPTZ('right')">Баруун ▶</button>
                <div></div>
                <button class="ptz-btn" onclick="sendPTZ('down')">▼ Доош</button>
                <div></div>
            </div>
            <div class="zoom-group">
                <button class="ptz-btn" onclick="sendPTZ('zoomin')">🔍 Zoom (+)</button>
                <button class="ptz-btn" onclick="sendPTZ('zoomout')">🔎 Zoom (-)</button>
            </div>
        </div>
    </div>

    <script>
        // Идэвхтэй ажиллаж буй Cloudflare хаягуудаа тавина:
        const API_HOST = "https://extra-pointing-regression-meet.trycloudflare.com";
        const STREAM_URL = "https://amounts-live-richardson-rather.trycloudflare.com/live";

        let activeDev = "";
        let activeCh = 1;

        // 1. Серверээс яг одоо холбоотой байгаа камеруудыг татах
        function fetchConnectedCameras() {
            const grid = document.getElementById('camGrid');
            grid.innerHTML = "<div style='color: #64748b;'>Хайж байна...</div>";

            fetch(`${API_HOST}/cameras`)
                .then(r => r.json())
                .then(cameras => {
                    grid.innerHTML = "";
                    document.getElementById('camCount').innerText = cameras.length;

                    if (cameras.length === 0) {
                        grid.innerHTML = "<div style='color: #ef4444;'>Одоогоор серверт холбогдсон төхөөрөмж алга байна.</div>";
                        return;
                    }

                    cameras.forEach((cam, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'cam-btn';
                        btn.innerText = `${cam.name} (CH ${cam.channel})`;
                        btn.onclick = () => selectCamera(cam.devId, cam.channel, `${cam.name} CH ${cam.channel}`, btn);
                        grid.appendChild(btn);

                        // Эхний камерыг анхдагчаар нээх
                        if (index === 0 && !activeDev) {
                            selectCamera(cam.devId, cam.channel, `${cam.name} CH ${cam.channel}`, btn);
                        }
                    });
                })
                .catch(err => {
                    console.error("Камер татах алдаа:", err);
                    grid.innerHTML = "<div style='color: #ef4444;'>Сервертэй холбогдож чадсангүй.</div>";
                });
        }

        // 2. Сонгосон камерын шууд дүрсийг нээх
        function selectCamera(dev, ch, title, btn) {
            activeDev = dev;
            activeCh = ch;

            document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            document.getElementById('currentCamTitle').innerText = title + " (ШУУД)";
            document.getElementById('statusBadge').innerText = "ХОЛБОЖ БАЙНА...";
            document.getElementById('statusBadge').style.background = "#d97706";

            fetch(`${API_HOST}/switch?dev=${dev}&ch=${ch}`)
                .then(r => r.json())
                .then(d => {
                    setTimeout(() => {
                        document.getElementById('livePlayer').src = `${STREAM_URL}?t=${Date.now()}`;
                        document.getElementById('statusBadge').innerText = "ШУУД ДҮРС";
                        document.getElementById('statusBadge').style.background = "#16a34a";
                    }, 2500);
                });
        }

        // 3. Бичлэг ухраах хүсэлт илгээх (Playback)
        function playRecord() {
            const timeVal = document.getElementById('playbackTime').value;
            if (!timeVal) {
                alert("Ухрааж үзэх огноо, цагаа сонгоно уу!");
                return;
            }
            if (!activeDev) {
                alert("Эхлээд камераа сонгоно уу!");
                return;
            }

            // ISO форматаас (YYYY-MM-DDTHH:MM) YYYYMMDDTHHMMSS болгох
            const dateObj = new Date(timeVal);
            const pad = (n) => n.toString().padStart(2, '0');
            const startStr = `${dateObj.getFullYear()}${pad(dateObj.getMonth()+1)}${pad(dateObj.getDate())}T${pad(dateObj.getHours())}${pad(dateObj.getMinutes())}00`;

            // Дуусах цагийг эхлэх цагаас 30 минутын дараагаар авах
            const endDateObj = new Date(dateObj.getTime() + 30*60000);
            const endStr = `${endDateObj.getFullYear()}${pad(endDateObj.getMonth()+1)}${pad(endDateObj.getDate())}T${pad(endDateObj.getHours())}${pad(endDateObj.getMinutes())}00`;

            document.getElementById('statusBadge').innerText = "БИЧЛЭГ ХАЙЖ БАЙНА...";
            document.getElementById('statusBadge').style.background = "#8b5cf6";

            fetch(`${API_HOST}/playback?dev=${activeDev}&ch=${activeCh}&start=${startStr}&end=${endStr}`)
                .then(r => r.json())
                .then(d => {
                    setTimeout(() => {
                        document.getElementById('livePlayer').src = `${STREAM_URL}?t=${Date.now()}`;
                        document.getElementById('currentCamTitle').innerText = `${activeDev} CH ${activeCh} (БИЧЛЭГ: ${timeVal})`;
                        document.getElementById('statusBadge').innerText = "БИЧЛЭГ ТОГЛОЖ БАЙНА";
                        document.getElementById('statusBadge').style.background = "#6366f1";
                    }, 3000);
                });
        }

        function returnToLive() {
            if (activeDev) {
                selectCamera(activeDev, activeCh, `${activeDev} CH ${activeCh}`, null);
            }
        }

        function sendPTZ(cmd) {
            if (!activeDev) return;
            fetch(`${API_HOST}/ptz?dev=${activeDev}&ch=${activeCh}&cmd=${cmd}`);
        }

        // Хуудас ачаалагдахад динамик жагсаалтыг дуудах
        window.onload = () => {
            fetchConnectedCameras();
            // Одоогийн цагийг default огноонд тааруулах
            const now = new Date();
            now.setMinutes(now.getMinutes() - 10);
            document.getElementById('playbackTime').value = now.toISOString().slice(0,16);
        };
    </script>
</body>
</html>
