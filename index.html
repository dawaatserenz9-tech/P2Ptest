<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>TandemVu Dual Camera Live</title>
    <script src="https://open.ys7.com/sdk/js/2.0/ezuikit.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; }
        .stream-grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .video-box { width: 640px; height: 360px; background: #000; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>

    <h2>TandemVu Live Stream (P2P Low-Latency)</h2>

    <div class="stream-grid">
        <!-- 1-р суваг: Panoramic өргөн дуран -->
        <div>
            <h3>1. Panoramic Дуран</h3>
            <div id="video-panoramic" class="video-box"></div>
        </div>

        <!-- 2-р суваг: 25X PTZ эргэдэг дуран -->
        <div>
            <h3>2. PTZ 25X Дуран</h3>
            <div id="video-ptz" class="video-box"></div>
        </div>
    </div>

    <script>
        const SERIAL_NO = "GK4145227";           // Таны камерын сериал
        const VERIFY_CODE = "ТАНЫ_НУУЦ_ҮГ";       // Таны тавьсан Verification Code
        const ACCESS_TOKEN = "ТАНЫ_ACCESS_TOKEN"; // Hik-Connect Developer Token

        // 1-р суваг (Panoramic)
        var player1 = new EZUIKit.EZUIPlayer({
            id: 'video-panoramic',
            autoplay: true,
            url: `ezopen://${VERIFY_CODE}@open.hik-connect.com/${SERIAL_NO}/1.live`,
            accessToken: ACCESS_TOKEN,
            width: 640,
            height: 360
        });

        // 2-р суваг (PTZ)
        var player2 = new EZUIKit.EZUIPlayer({
            id: 'video-ptz',
            autoplay: true,
            url: `ezopen://${VERIFY_CODE}@open.hik-connect.com/${SERIAL_NO}/2.live`,
            accessToken: ACCESS_TOKEN,
            width: 640,
            height: 360
        });

        player1.play();
        player2.play();
    </script>
</body>
</html>
