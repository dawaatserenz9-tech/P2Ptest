<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>WebRTC P2P Video Call</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
        h2 { color: #333; }
        .video-container { display: flex; gap: 20px; margin-top: 20px; }
        .video-box { background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        video { width: 400px; height: 225px; background: #000; border-radius: 4px; display: block; }
        .controls { margin-bottom: 15px; }
        input[type="text"] { padding: 6px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 7px 15px; font-size: 14px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #0056b3; }
        #log { margin-top: 20px; background: #fff; border: 1px solid #ddd; padding: 10px; height: 150px; overflow-y: scroll; font-family: monospace; font-size: 13px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>WebRTC P2P Video Call (Webcam)</h2>

    <div class="controls">
        <input type="text" id="wsServerInput" value="wss://dwelled-mangle-lethargic.ngrok-free.dev" style="width: 320px;" />
        <button id="connectServerBtn">Connect to Signaling</button>
        <button id="startCallBtn" disabled>Start P2P Call</button>
    </div>

    <div class="video-container">
        <div class="video-box">
            <h3>Local Camera</h3>
            <!-- Өөрийн камерын дууг давхардаж сонсохгүйн тулд muted хийсэн -->
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="video-box">
            <h3>Remote Peer Camera</h3>
            <!-- Алсын талын хүн ярих тул muted байхгүй -->
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div id="log"></div>

    <script src="app.js"></script>
</body>
</html>
